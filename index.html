<style>
:root{--bg:#0a0a0a;--g:#d4af37;--l:#f3d77a;--d:#6b5a22;--m:#a08a45;--t:#f2ead3}

body{background:var(--bg);color:var(--t);font:700 15px/1.45 "Courier New",ui-monospace,monospace;letter-spacing:.04em;min-height:100vh;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 28px;max-width:520px;margin:auto;text-align:center}

.bob{animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-6px)}}

a.b small{display:block;color:var(--m);font-weight:400;font-size:12px;margin-top:2px}
