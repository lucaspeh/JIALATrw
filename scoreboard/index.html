<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard</title>
<style>
:root{--bg:#0a0a0a;--g:#d4af37;--l:#f3d77a;--d:#6b5a22;--t:#f2ead3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:700 15px/1.45 "Courier New",ui-monospace,monospace;letter-spacing:.04em;min-height:100vh}
button{font:inherit;color:var(--t);background:#161616;border:3px solid var(--d);padding:10px 12px;box-shadow:3px 3px 0 #000;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.on,button.go{border-color:var(--g);color:var(--l)}
button.go{background:#2a2108}
input{font:inherit;background:#111;color:var(--t);border:3px solid var(--d);padding:8px;width:100%}
.dot{position:fixed;top:10px;right:10px;width:12px;height:12px;background:#555;z-index:5}.dot.ok{background:#5ad17a}.dot.bad{background:#e5484d}
body.tv #H,body:not(.tv) #T{display:none}
/* chooser */
body.landing #H{max-width:none;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
body.landing .dot{display:none}
.chooser{text-align:center;width:min(100%,520px)}
.chooser h1{color:var(--l);font-size:clamp(25px,5vw,42px);margin:15px 0 20px;text-shadow:3px 3px 0 #000}
.chooser .rw{justify-content:center;gap:12px}
.chooser button{min-width:166px;padding:15px 18px}
.pixel-abacus{width:144px;height:116px;shape-rendering:crispEdges;filter:drop-shadow(5px 5px 0 #000)}
.bead-one{animation:slide-one 1.8s steps(3) infinite alternate}
.bead-two{animation:slide-two 2.3s steps(4) infinite alternate}
.bead-three{animation:slide-three 2.7s steps(4) infinite alternate}
@keyframes slide-one{to{transform:translateX(4px)}}
@keyframes slide-two{to{transform:translateX(6px)}}
@keyframes slide-three{to{transform:translateX(3px)}}
.host-icon{display:inline-flex;vertical-align:middle;align-items:center;margin-right:8px}
.host-icon svg{animation:tally-tick 1.2s steps(2) infinite;transform-origin:bottom left}
@keyframes tally-tick{50%{transform:rotate(-10deg)}}
@media(prefers-reduced-motion:reduce){.bead-one,.bead-two,.bead-three,.host-icon svg{animation:none}}
/* host */
#H{max-width:860px;margin:auto;padding:14px}
.hd{display:flex;justify-content:space-between;color:var(--g);font-size:17px;margin-bottom:10px}
.lb{color:var(--d);font-size:12px;margin:12px 0 6px}.sm{color:var(--d);font-size:12px}
.rw,.gd,.tabs{display:flex;flex-wrap:wrap;gap:8px}
.gd button{flex:1 1 30%}.tabs button{flex:1;padding:10px 0}
.card{border:3px solid var(--g);padding:14px;margin-top:12px;box-shadow:5px 5px 0 #000,5px 5px 0 1px var(--d)}
.card h2{color:var(--l);margin:4px 0}.card p{color:#cfc6a8;font-weight:400;margin-bottom:6px}
.msg{color:var(--l);margin-top:8px}
details{margin-top:14px}summary{cursor:pointer;color:var(--g)}
.nr{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin-top:6px}
.nr button{padding:6px 12px}
.clock{font-size:clamp(30px,8vw,58px);color:var(--l);font-variant-numeric:tabular-nums;margin:8px 0}
.turn{border:2px solid var(--d);padding:12px;margin:10px 0;background:#111}
.turn .rw button{flex:1 1 190px;min-height:58px}
.results{display:grid;gap:7px;margin-top:10px}
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(104px,150px) auto;align-items:center;gap:8px}
.result input{font-variant-numeric:tabular-nums}
.result b{min-width:52px;text-align:right;color:var(--l)}
.result .who{overflow-wrap:anywhere}
.hint{color:#cfc6a8;font-size:12px;font-weight:400;margin-top:8px}
.warn{color:#f3d77a;margin-top:8px}
@media(max-width:440px){.result{grid-template-columns:minmax(0,1fr) 100px auto}.result b{min-width:34px}}
/* tv */
#T{height:100vh;padding:3vh 4vw;text-align:center}
#msg{height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh}
#bd{height:100%;flex-direction:column}
#T h1{font-size:7vh;color:var(--l);text-shadow:.6vh .6vh 0 #000}
.tag{border:.5vh solid var(--g);padding:.8vh 2vw;font-size:2.6vh;color:var(--g)}
.rl{font-size:3.2vh;max-width:70vw;font-weight:400;color:#cfc6a8}
.gr{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.gb{border:.5vh solid var(--d);padding:1.4vh 2vw;font-size:2.8vh;background:#111}
#T .sm{font-size:2.6vh}
#ban{height:6vh;font-size:3.4vh;color:var(--l);margin-top:1vh}
#rows{position:relative;flex:1;margin-top:1vh}
.row{position:absolute;left:0;right:0;top:0;height:10%;transition:transform .9s steps(10)}
.in{height:100%;padding:.5vh 0;display:flex;align-items:center;gap:2vw}
.rk{width:6vh;font-size:4vh;color:var(--g)}
.bar{flex:1;height:100%;border:.5vh solid var(--d);background:#111;position:relative;display:flex;align-items:center}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);transition:width .9s steps(12)}
.nm{position:relative;z-index:1;padding-left:2vw;font-size:3.6vh;text-shadow:.4vh .4vh 0 #000;display:flex;gap:1.2vw;align-items:center}
.pt{width:11vh;font-size:4.4vh;color:var(--l);text-align:right}
.z0{--c:#d4af37}.z1{--c:#7a6420}.z2{--c:#b5651d}.z3{--c:#a8262c}
.hid .bar i{width:0!important}.hid .nm{color:#555}
.hop .in{animation:hop .5s steps(4)}
#lg{font-size:2vh;color:var(--d);margin-top:1vh}
.bob{animation:bob 1s steps(2) infinite}.wob{animation:wob .6s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-1.4vh)}}@keyframes bob{50%{transform:translateY(-1.2vh)}}@keyframes wob{50%{transform:rotate(-8deg)}}
.cf{position:fixed;top:-3vh;width:1.4vh;height:1.4vh;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh)}}
</style></head><body>
<i id="dot" class="dot"></i>
<div id="H"></div>
<div id="T"><div id="msg"></div><div id="bd"><h1 id="th"></h1><div id="ban"></div><div id="rows"></div><div id="lg">1-6 SAFE · 7-9 NEXT YEAR'S ORGANISERS · 10 THE JIALAT TROPHY</div></div></div>
<script>
// ---- CONFIG: change the topic to anything long and random (host and TV share this file) ----
const TOPIC='jialat26-k7q2m9x4vz', URL_='https://ntfy.sh/'+TOPIC;
// ---- GAMES (edit rules text here if your PPT differs) ----
const TAG={s:'SOLO · 10 → 1 PTS',p:'PAIRS · WIN 10 / OTHERS 5',t:'TEAMS · WIN 10 / LOSE 5'},EXP={s:55,p:60,t:75};
const G=[
{n:'Snow Blower',t:'s',r:'Clear one cotton ball from each of five upside-down cups using only a party blower. Fastest wins.'},
{n:'Christmas Fan-Atic',t:'s',r:'Hold a paper plate by its edge with your mouth. Fan the candle out by moving your head. No direct blowing. Fastest wins.'},
{n:'Chimney Drop',t:'p',r:'Each partner holds one end of a ribbon. Lower the hanging candy cane into a bottle three times. Fastest pair wins.',u:[[1,10],[2,9],[3,8],[4,7],[5,6]]},
{n:'Merry Christmas Candle Challenge',t:'s',r:'Say “Merry Christmas!” in one breath towards eight tea lights. Most candles extinguished wins; equal counts share points.'},
{n:'Christmas Touchdown',t:'p',r:'One partner places the mini tree while the other supports their balance. Neither crosses the line. Farthest valid placement wins.',u:[[1,9],[10,8],[2,7],[3,6],[4,5]]},
{n:'Ribbon Racer',t:'s',r:'Unroll the entire identical streamer without tearing or cutting it. Fastest complete unroll wins.'},
{n:'Ribbon Relay',t:'p',r:'Transfer the loosely wrapped ribbon from Partner A to Partner B by spinning. Fastest complete transfer wins.',u:[[1,8],[9,7],[10,6],[2,5],[3,4]]},
{n:'Reindeer Droppings',t:'t',r:'Carry one ornament between your knees and drop it in the basket. Most successful drops in 90 seconds wins.',u:[[1,3,5,7,9],[2,4,6,8,10]]},
{n:'Christmas Tree Stack',t:'t',r:'Stack cups on one teammate. Most cups still balanced after 60 seconds wins.',u:[[1,4,6,8,9],[2,3,5,7,10]]}];
// ---- pixel sprites ----
const SP={
tally:['BBBBBBBBBB','B........B','B.YY.....B','B.YY..Y..B','B.YY..Y..B','B.YY..Y..B','B.........B','BBBBBBBBBB'],
screen:['BBBBBBBBBBBB','B..........B','B.GG..Y....B','B.GG.YYY...B','B.GG..Y....B','B....YYY...B','B..........B','BBBBBBBBBBBB','....BBBB....','...BBBBBB...'],
medal:['...YYY...','..YYYYY..','.YYYYYYY.','.YYY.YYY.','..YYYYY..','...YYY...','...B.B...','..B...B..']};
const C={Y:'#f3d77a',G:'#2f9e5b',B:'#8a5a2b'};
function spr(k,px){const a=SP[k];let s='';a.forEach((r,y)=>[...r].forEach((c,x)=>{if(C[c])s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${C[c]}"/>`}));return `<svg viewBox="0 0 ${a[0].length} ${a.length}" width="${a[0].length*px}" height="${a.length*px}" shape-rendering="crispEdges">${s}</svg>`}
// ---- state ----
const D=()=>({v:0,g:0,m:['idle'],nm:Array.from({length:10},(_,i)=>'Player '+(i+1)),sc:Array.from({length:10},()=>Array(9).fill(null)),tb:Array(10).fill(0),rs:Array.from({length:9},()=>[]),ow:Array(9).fill(null)});
let S=D();try{const x=localStorage.getItem('jialat26');if(x)S=Object.assign(D(),JSON.parse(x))}catch(e){}
if(!Array.isArray(S.rs)||S.rs.length!==9)S.rs=D().rs;
if(!Array.isArray(S.ow)||S.ow.length!==9)S.ow=D().ow;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rn=i=>S.nm[i]||'P'+(i+1),nm=i=>esc(rn(i));
const ROLE=(location.hash.match(/host|tv/)||[''])[0];
const save=()=>{try{localStorage.setItem('jialat26',JSON.stringify(S))}catch(e){}};
const dot=ok=>{$('dot').className='dot '+(ok?'ok':'bad')};
let pt;function push(){clearTimeout(pt);pt=setTimeout(()=>{fetch(URL_,{method:'POST',body:JSON.stringify(S)}).then(r=>dot(r.ok)).catch(()=>dot(0))},250)}
function commit(){S.v=Date.now();save();render();push()}
function conn(){try{const e=new EventSource(URL_+'/sse?since=latest');e.onopen=()=>dot(1);e.onerror=()=>dot(0);
e.onmessage=ev=>{try{const j=JSON.parse(ev.data);if(j.event!=='message')return;const x=JSON.parse(j.message);if(x&&x.v>S.v){S=Object.assign(D(),x);save();render()}}catch(_){}}}catch(_){dot(0)}}
function stand(n){const t=S.sc.map((r,i)=>({i,t:r.slice(0,n).reduce((a,v)=>a+(v||0),0),b:S.tb[i]||0}));t.sort((a,b)=>b.t-a.t||b.b-a.b||a.i-b.i);t.forEach((o,k)=>o.r=k+1);return t}
const allDone=()=>S.sc.every(r=>r.every(v=>v!=null));
const unresolvedTie=()=>{const st=stand(9);return st.some((o,i)=>i>0&&o.t===st[i-1].t&&o.b===st[i-1].b)};
// ---- game results: timed races, measured distance and fixed-duration counts ----
const MODE=['time','time','time','count','distance','time','time','count','count'];
const LIMIT={7:90,8:60};
const units={time:'seconds',distance:'cm',count:'successful'};
let Q=null,beeper=null;
const size=g=>G[g].t=='s'?10:G[g].t=='p'?5:2;
const vals=g=>{if(!Array.isArray(S.rs[g]))S.rs[g]=[];return S.rs[g]};
const value=(g,i)=>vals(g)[i]??null;
const filled=g=>Array.from({length:size(g)},(_,i)=>value(g,i)).filter(v=>v!==null).length;
const completed=g=>filled(g)===size(g);
const better=(g,a,b)=>MODE[g]=='time'?a<b:a>b;
const label=(g,i)=>G[g].t=='s'?nm(i):G[g].t=='t'?'TEAM '+'AB'[i]+': '+G[g].u[i].map(p=>nm(p-1)).join(', '):G[g].u[i].map(p=>nm(p-1)).join(' &amp; ');
const shown=(g,v)=>v===null?'':MODE[g]=='time'?Number(v).toFixed(2):String(v);
function leaders(g){if(!completed(g))return [];let best=value(g,0);for(let i=1;i<size(g);i++)if(better(g,value(g,i),best))best=value(g,i);return Array.from({length:size(g)},(_,i)=>i).filter(i=>value(g,i)===best)}
function recalc(g){
 S.sc.forEach(r=>r[g]=null);
 if(!completed(g))return;
 if(G[g].t=='s'){
  const a=Array.from({length:10},(_,i)=>({i,v:value(g,i)})).sort((a,b)=>MODE[g]=='time'?a.v-b.v:b.v-a.v);
  for(let k=0;k<10;){let end=k+1;while(end<10&&a[end].v===a[k].v)end++;
   const points=10-k-(end-k-1)/2;for(let j=k;j<end;j++)S.sc[a[j].i][g]=points;k=end}
 }else{
  const top=leaders(g),w=top.length===1?top[0]:S.ow[g];
  if(w===null||!top.includes(w))return;
  G[g].u.forEach((u,i)=>u.forEach(p=>S.sc[p-1][g]=i===w?10:5));
 }
}
function setResult(g,i,raw,fromTimer=false){
 if(g<0||g>8||i<0||i>=size(g))return;
 let v=null;
 if(String(raw).trim()!==''){
  v=Number(raw);
  const ok=Number.isFinite(v)&&v>=0&&(MODE[g]!='time'||v>0)&&(MODE[g]!='count'||Number.isInteger(v))&&(g!==3||v<=8);
  if(!ok){alert(g===3?'Enter a whole number from 0 to 8.':'Enter a valid '+units[MODE[g]]+' result.');host();return}
  if(MODE[g]=='time')v=Math.round(v*100)/100;
  if(MODE[g]=='distance')v=Math.round(v*10)/10;
 }
 vals(g)[i]=v;S.ow[g]=null;
 if(Q&&Q.g===g&&!fromTimer)Q=null;
 recalc(g);commit();
}
function chooseWinner(g,i){if(!leaders(g).includes(i))return;S.ow[g]=i;recalc(g);commit()}
function clr(g){
 if((filled(g)||S.sc.some(r=>r[g]!==null))&&!confirm('Clear every result and score for this game?'))return;
 if(Q&&Q.g===g)Q=null;S.rs[g]=[];S.ow[g]=null;S.sc.forEach(r=>r[g]=null);commit()
}
function sg(i){if(Q&&Q.g!==i){if(!confirm('Cancel the running timer and switch games?'))return;Q=null}S.g=i;if(S.m[0]=='rules')S.m=['rules',i];commit()}
function startTimer(g){
 if(Q||MODE[g]!=='time'&&!LIMIT[g])return;
 const open=Array.from({length:size(g)},(_,i)=>i).filter(i=>value(g,i)===null);
 if(!open.length)return;
 Q={g,slots:open.slice(0,MODE[g]=='time'&&G[g].t=='s'?2:1),start:performance.now(),ends:[],expired:false};
 if(LIMIT[g]){try{beeper=beeper||new (window.AudioContext||window.webkitAudioContext)();beeper.resume()}catch(e){}}
 host()
}
function finishTimer(j){
 if(!Q||MODE[Q.g]!=='time'||Q.ends[j]!=null)return;
 const g=Q.g,i=Q.slots[j],v=Math.max(.01,Math.round((performance.now()-Q.start)/10)/100);
 Q.ends[j]=v;if(Q.ends.filter(x=>x!=null).length===Q.slots.length)Q=null;
 setResult(g,i,v,true)
}
function cancelTimer(){Q=null;host()}
function beep(){try{if(!beeper)return;const o=beeper.createOscillator(),a=beeper.createGain();o.connect(a);a.connect(beeper.destination);o.frequency.value=880;a.gain.value=.15;o.start();o.stop(beeper.currentTime+.4)}catch(e){}}
function tick(){
 if(!Q)return;
 const elapsed=performance.now()-Q.start,left=LIMIT[Q.g]?Math.max(0,LIMIT[Q.g]*1000-elapsed):elapsed;
 const c=$('clock');if(c)c.textContent=(left/1000).toFixed(LIMIT[Q.g]?1:2)+'s';
 if(LIMIT[Q.g]&&!Q.expired&&left<=0){Q.expired=true;beep();host()}
}
setInterval(tick,50);
function tvm(m){if(m[0]=='rev'&&(!allDone()||unresolvedTie()))return;S.m=m;commit()}
function rv(d){S.m=['rev',Math.max(0,Math.min(10,(S.m[1]||0)+d))];commit()}
function nn(i,v){S.nm[i]=v.trim().slice(0,14);commit()}
function tbb(i,d){S.tb[i]=Math.max(0,(S.tb[i]||0)+d);commit()}
function reset(){if(confirm('Reset ALL scores? Names are kept.')){const n=S.nm;Q=null;S=D();S.nm=n;commit()}}
function copyRes(){const t='🎄 JIALAT Christmas 2026\n'+stand(9).map(o=>`${o.r}. ${rn(o.i)} - ${o.t}`).join('\n');navigator.clipboard.writeText(t).catch(()=>prompt('Copy:',t))}
// ---- host ----
function resultPanel(g){
 const mode=MODE[g],x=G[g],n=size(g),a=vals(g);
 const next=Array.from({length:n},(_,i)=>i).filter(i=>value(g,i)===null);
 let h='';
 if(mode=='time'||LIMIT[g]){
  const active=Q&&Q.g===g,slots=active?Q.slots:next.slice(0,mode=='time'&&x.t=='s'?2:1);
  h+='<div class="turn"><div class="lb">NEXT TURN</div>';
  if(!active)h+=slots.length?'<div>'+slots.map(i=>label(g,i)).join(' <span style="color:var(--g)">vs</span> ')+'</div><div class="rw" style="margin-top:10px"><button class="go" onclick="startTimer('+g+')">Start '+(LIMIT[g]?LIMIT[g]+'s countdown':'timer')+'</button></div>':'<div>All results recorded. Edit a result below to correct or replay it.</div>';
  else{
   h+='<div>'+slots.map(i=>label(g,i)).join(' <span style="color:var(--g)">vs</span> ')+'</div><div class="clock" id="clock">'+(LIMIT[g]?LIMIT[g].toFixed(1):'0.00')+'s</div>';
   if(mode=='time')h+='<div class="rw">'+slots.map((i,j)=>'<button class="'+(Q.ends[j]!=null?'on':'go')+'" onclick="finishTimer('+j+')" '+(Q.ends[j]!=null?'disabled':'')+'>'+(Q.ends[j]!=null?'Saved '+shown(g,Q.ends[j])+'s':'Finish '+label(g,i))+'</button>').join('')+'</div>';
   if(LIMIT[g])h+='<div class="'+(Q.expired?'warn':'hint')+'">'+(Q.expired?'TIME! Count the successful items and enter the result below.':'Count the successful items when the clock reaches zero.')+'</div>';
   h+='<div class="rw" style="margin-top:10px"><button onclick="cancelTimer()">Reset turn timer</button></div>';
  }
  h+='</div>';
 }
 h+='<div class="lb">RECORD '+(mode=='time'?'TIME IN SECONDS':mode=='distance'?'DISTANCE IN CM':'SUCCESSFUL COUNT')+' · '+filled(g)+' / '+n+'</div>';
 if(g===3)h+='<div class="hint">Tied candle counts share the points for those places. No replay needed.</div>';
 if(mode=='time')h+='<div class="hint">One observer taps Finish for each player or pair. Hand them this device if you are playing. Correct any time below if needed.</div>';
 if(LIMIT[g])h+='<div class="hint">Enter each team’s count after its countdown. The page picks the higher count.</div>';
 h+='<div class="results">'+Array.from({length:n},(_,i)=>{
  const p=x.t=='s'?S.sc[i][g]:x.u?S.sc[x.u[i][0]-1][g]:null;
  return '<label class="result"><span class="who">'+label(g,i)+'</span><input type="number" inputmode="decimal" min="'+(mode=='time'?'0.01':'0')+'" '+(g===3?'max="8" ':'')+'step="'+(mode=='count'?'1':mode=='time'?'0.01':'0.1')+'" value="'+shown(g,value(g,i))+'" aria-label="'+(mode=='time'?'Seconds':mode=='distance'?'Centimetres':'Count')+' for '+esc(x.t=='s'?rn(i):x.t=='t'?'Team '+'AB'[i]:'pair '+(i+1))+'" onchange="setResult('+g+','+i+',this.value)"><b>'+(p===null?'': '+'+p)+'</b></label>'
 }).join('')+'</div>';
 if(completed(g)&&x.t!=='s'){
  const top=leaders(g);
  if(top.length>1)h+='<div class="warn">Top result is tied. Replay the tied '+(x.t=='p'?'pairs':'teams')+', then select the winner:</div><div class="rw" style="margin-top:8px">'+top.map(i=>'<button class="'+(S.ow[g]===i?'on':'')+'" onclick="chooseWinner('+g+','+i+')">'+label(g,i)+'</button>').join('')+'</div>';
  else h+='<div class="msg">Winner: '+label(g,top[0])+'</div>';
 }
 return h;
}
function host(){const g=S.g,x=G[g],done=G.map((_,i)=>S.sc.every(r=>r[i]!=null)),m=S.m,ready=allDone()&&!unresolvedTie();
const btn=[['Title',['idle']],['Rules',['rules',g]],['After G3',['board',3]],['After G6',['board',6]],['Live',['board',9]],['Final reveal',['rev',0]]];
let h=`<div class="hd"><b><span class="host-icon" aria-hidden="true">${spr('tally',3)}</span>JIALAT 2026 · HOST</b></div><div class="lb">TV SHOWS</div><div class="rw">${btn.map(([l,mm])=>`<button class="${m[0]==mm[0]&&(m[0]!='board'||m[1]==mm[1])?'on':''}" onclick='tvm(${JSON.stringify(mm)})' ${l==='Final reveal'&&!ready?'disabled title="Complete all games and settle ties first"':''}>${l}</button>`).join('')}</div>`;
if(!ready)h+=`<div class="sm" style="margin-top:8px">Final reveal unlocks after all nine games and any ties are settled.</div>`;
if(m[0]=='rev')h+=`<div class="rw" style="margin-top:8px"><button onclick="rv(-1)">◀ Back</button><button class="go" onclick="rv(1)">Next ▶ (${m[1]}/10)</button></div>`;
h+=`<div class="lb">GAME</div><div class="tabs">${G.map((_,i)=>`<button class="${i==g?'on':''}" onclick="sg(${i})">${i+1}${done[i]?'✓':''}</button>`).join('')}</div>`;
let c=`<div class="card"><div class="sm">GAME ${g+1} · ${TAG[x.t]}</div><h2>${x.n}</h2><p>${x.r}</p>`;
c+=resultPanel(g);
const sum=S.sc.reduce((a,r)=>a+(r[g]||0),0);
c+=`<div class="rw" style="margin-top:10px"><button onclick="clr(${g})">Clear game</button></div><div class="sm" style="margin-top:8px">POINTS GIVEN ${sum} / ${EXP[x.t]} ${sum==EXP[x.t]?'✓':''}</div></div>`;
h+=c;
const st=stand(9),ties=allDone()?st.filter((o,k)=>(k>0&&st[k-1].t==o.t&&st[k-1].b==o.b)).map(o=>o.r-1):[];
h+=`<div class="lb">STANDINGS</div><div style="line-height:1.8">${st.map(o=>`${o.r}. ${nm(o.i)} <b style="color:var(--l)">${o.t}</b>`).join(' · ')}</div>`;
if(ties.length)h+=`<div class="msg">TIE FOR PLACE ${ties.join(', ')}: replay Snow Blower, then give the winner a +1 tie-break below.</div>`;
h+=`<div class="rw" style="margin-top:10px"><button onclick="copyRes()">Copy results</button></div>
<details><summary>NAMES &amp; TIE-BREAK</summary>${S.nm.map((n,i)=>`<div class="nr"><input value="${esc(n)}" maxlength="14" onchange="nn(${i},this.value)"><button onclick="tbb(${i},-1)">−</button><span>${S.tb[i]||0}</span><button onclick="tbb(${i},1)">+</button></div>`).join('')}<div class="rw" style="margin-top:12px"><button onclick="reset()">Reset all scores</button></div></details>`;
$('H').innerHTML=h}
// ---- tv ----
const rows=[];
function mkRows(){for(let i=0;i<10;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<div class="in"><b class="rk"></b><div class="bar"><i></i><span class="nm"></span></div><b class="pt"></b></div>';$('rows').appendChild(d);rows.push(d)}}
function confetti(){for(let k=0;k<80;k++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:${['#f3d77a','#d4af37','#fff','#2f9e5b','#e5484d'][k%5]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.5}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),7000)}}
let lastRev=-1;
function tv(){const m=S.m,b=m[0]=='board'||m[0]=='rev';$('bd').style.display=b?'flex':'none';$('msg').style.display=b?'none':'flex';
if(!b){lastRev=-1;if(m[0]=='rules'){const x=G[m[1]];$('msg').innerHTML=`<div class="bob">${spr('screen',6)}</div><div class="sm">GAME ${m[1]+1} / 9</div><h1>${x.n}</h1><div class="tag">${TAG[x.t]}</div><p class="rl">${esc(x.r)}</p><div class="gr">${x.u?x.u.map((u,k)=>`<div class="gb">${x.t=='t'?'TEAM '+'AB'[k]+'<br>':''}${u.map(p=>nm(p-1)).join(x.t=='t'?' · ':' &amp; ')}</div>`).join(''):''}</div>`}
else $('msg').innerHTML=`<div class="bob">${spr('screen',8)}</div><h1>JIALAT CHRISTMAS 2026</h1><div class="tag">18 YEARS · 10 FRIENDS · 9 GAMES</div>`;return}
const rev=m[0]=='rev',k=rev?m[1]:10,n=rev?9:m[1],fin=rev||(n>=9&&allDone()),st=stand(n),top=Math.max(1,st[0].t);
$('th').textContent=rev?'THE FINAL VERDICT':n>=9?(fin?'FINAL STANDINGS':'LIVE STANDINGS'):'AFTER GAME '+n;
$('ban').textContent=!rev?'':k==10?'👑 CHAMPION: '+rn(st[0].i).toUpperCase():k>=4?"NEXT YEAR'S ORGANISERS: "+[6,7,8].map(j=>rn(st[j].i)).join(' · ').toUpperCase():k>=1?'THE JIALAT TROPHY GOES TO '+rn(st[9].i).toUpperCase():'';
st.forEach(o=>{const d=rows[o.i],hide=rev&&o.r<=10-k,z=o.r==10?3:o.r>=7?2:o.r==1?0:1,old=d.dataset.r;
d.style.transform=`translateY(${(o.r-1)*100}%)`;d.className='row z'+z+(hide?' hid':'');
if(old&&old!=o.r&&!hide){d.classList.add('hop')}d.dataset.r=o.r;
d.querySelector('.rk').textContent=o.r;d.querySelector('.nm').innerHTML=hide?'???':esc(rn(o.i))+(fin&&o.r==10?`<span class="wob">${spr('medal',3)}</span>`:fin&&o.r>=7&&o.r<10?'<small>ORGANISER</small>':'');
d.querySelector('i').style.width=hide?'0':(o.t/top*100)+'%';d.querySelector('.pt').textContent=hide?'':o.t});
if(rev&&k==10&&lastRev!=10)confetti();lastRev=rev?k:-1}
// ---- boot ----
function render(){document.body.className=ROLE||'landing';if(ROLE=='host')host();else if(ROLE=='tv')tv();else $('H').innerHTML=`<div class="chooser"><svg class="pixel-abacus" viewBox="0 0 18 14" aria-label="Animated pixel abacus" role="img">
<path fill="#d4af37" d="M1 1h16v1H1zM1 2h1v10H1zM16 2h1v10h-1zM1 12h16v1H1z"/>
<path fill="#6b5a22" d="M3 4h12v1H3zM3 7h12v1H3zM3 10h12v1H3z"/>
<g class="bead-one"><path fill="#f3d77a" d="M4 3h2v3H4z"/></g>
<g class="bead-two"><path fill="#f3d77a" d="M5 6h2v3H5z"/></g>
<g class="bead-three"><path fill="#f3d77a" d="M7 9h2v3H7z"/></g>
</svg><h1>SCOREBOARD</h1><div class="rw"><button class="go" onclick="location.hash='host';location.reload()">iPad · Host</button><button class="go" onclick="location.hash='tv';location.reload()">MacBook · TV</button></div></div>`}
if(ROLE=='tv'){mkRows();$('T').ondblclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
render();if(ROLE)conn();
</script></body></html>
