<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard</title>
<style>
:root{--bg:#0a0a0a;--g:#d4af37;--l:#f3d77a;--d:#6b5a22;--t:#f2ead3;--muted:#b9b6a8;--ice:#86baff;--teal:#65d9cb;--coral:#ff8b78}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:700 15px/1.45 "Courier New",ui-monospace,monospace;letter-spacing:.04em;min-height:100vh}
button{font:inherit;color:var(--t);background:#161616;border:3px solid var(--d);padding:10px 12px;box-shadow:3px 3px 0 #000;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.on,button.go{border-color:var(--g);color:var(--l)}
button.go{background:#2a2108}
input{font:inherit;background:#111;color:var(--t);border:3px solid var(--d);padding:8px;width:100%}
.dot{position:fixed;top:10px;right:10px;width:12px;height:12px;background:#555;z-index:5}.dot.ok{background:#5ad17a}.dot.bad{background:#e5484d}
#sync{position:fixed;top:7px;right:27px;z-index:5;font:12px/18px system-ui,sans-serif;color:#ddd;background:#111b;padding:1px 6px;border-radius:3px}
body.tv #H,body:not(.tv) #T{display:none}
/* chooser */
body.landing #H{max-width:none;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
body.landing .dot{display:none}
.chooser{text-align:center;width:min(100%,520px)}
.chooser h1{color:var(--l);font-size:clamp(25px,5vw,42px);margin:15px 0 20px;text-shadow:3px 3px 0 #000}
.chooser .rw{justify-content:center;gap:12px}
.chooser button{min-width:166px;padding:15px 18px}
.pixel-abacus{width:144px;height:116px;shape-rendering:crispEdges;filter:drop-shadow(5px 5px 0 #000)}
.bead-one{animation:slide-one 1.8s steps(3) infinite alternate}
.bead-two{animation:slide-two 2.3s steps(4) infinite alternate}
.bead-three{animation:slide-three 2.7s steps(4) infinite alternate}
@keyframes slide-one{to{transform:translateX(4px)}}
@keyframes slide-two{to{transform:translateX(6px)}}
@keyframes slide-three{to{transform:translateX(3px)}}
.host-icon{display:inline-flex;vertical-align:middle;align-items:center;margin-right:8px}
.host-icon svg{animation:tally-tick 1.2s steps(2) infinite;transform-origin:bottom left}
@keyframes tally-tick{50%{transform:rotate(-10deg)}}
@media(prefers-reduced-motion:reduce){.bead-one,.bead-two,.bead-three,.host-icon svg{animation:none}}
.soundbar{display:flex;align-items:center;gap:8px;margin:7px 0 12px}
.soundbar button{padding:7px 10px;font-size:12px}
.soundbar button.sound-on{border-color:var(--teal);color:var(--teal)}
/* host */
#H{max-width:860px;margin:auto;padding:14px}
.hd{display:flex;justify-content:space-between;color:var(--g);font-size:17px;margin-bottom:10px}
.lb{color:var(--muted);font-size:12px;margin:12px 0 6px}.sm{color:var(--muted);font-size:12px}
.rw,.gd,.tabs{display:flex;flex-wrap:wrap;gap:8px}
.gd button{flex:1 1 30%}.tabs button{flex:1;padding:10px 0}
.card{border:3px solid var(--g);padding:14px;margin-top:12px;box-shadow:5px 5px 0 #000,5px 5px 0 1px var(--d)}
.card h2{color:var(--l);margin:4px 0}.card p{color:#cfc6a8;font-weight:400;margin-bottom:6px}
.msg{color:var(--l);margin-top:8px}
details{margin-top:14px}summary{cursor:pointer;color:var(--g)}
.nr{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin-top:6px}
.nr button{padding:6px 12px}
.clock{font-size:clamp(30px,8vw,58px);color:var(--teal);font-variant-numeric:tabular-nums;margin:8px 0}
.turn{border:2px solid var(--d);padding:12px;margin:10px 0;background:#111}
.turn .rw button{flex:1 1 190px;min-height:58px}
.results{display:grid;gap:7px;margin-top:10px}
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(104px,150px) auto;align-items:center;gap:8px}
.result input{font-variant-numeric:tabular-nums}
.result b{min-width:52px;text-align:right;color:var(--l)}
.result .who{overflow-wrap:anywhere}
.hint{color:#cfc6a8;font-size:12px;font-weight:400;margin-top:8px}
.warn{color:var(--coral);margin-top:8px}
@media(max-width:440px){.result{grid-template-columns:minmax(0,1fr) 100px auto}.result b{min-width:34px}}
.hostcheck{font-weight:400;color:#cfc6a8;padding:4px 0 8px}
/* tv */
#T{height:100vh;padding:3vh 4vw;text-align:center}
#msg{height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh}
#msg.spotlight{border:1vh solid var(--g);background:radial-gradient(circle at 50% 42%,#2b220d 0%,#0a0a0a 68%);padding:3vh 4vw;gap:2vh}
#msg.spotlight.trophy{border-color:var(--coral);background:radial-gradient(circle at 50% 42%,#341c19 0%,#0a0a0a 68%)}
#msg.spotlight h1{font-size:clamp(46px,10vh,130px);line-height:1.02;letter-spacing:.08em}
#msg.spotlight .spot-name{font-size:clamp(42px,9vh,120px);line-height:1.1;color:#fff;text-shadow:.7vh .7vh 0 #000;overflow-wrap:anywhere}
#msg.spotlight .spot-rank{font-size:clamp(20px,4vh,48px);color:var(--g);letter-spacing:.18em}
#msg.spotlight.trophy .spot-rank{color:var(--coral)}
#msg.spotlight .spot-icon svg{width:min(17vh,170px);height:auto;animation:spot-bob 1.2s steps(3) infinite alternate}
@keyframes spot-bob{to{transform:translateY(-1vh) rotate(5deg)}}
@media(prefers-reduced-motion:reduce){#msg.spotlight .spot-icon svg{animation:none}}
#msg.rules{gap:1.3vh;padding:1vh 0}
#msg.rules h1{font-size:clamp(28px,6vh,76px);line-height:1.05}
.guideGoal{font-size:clamp(18px,3vh,38px);color:#fff;font-weight:400;max-width:90vw}
.guideSteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1vw;width:92vw;text-align:left}
.guideStep{border:.4vh solid var(--d);background:#111;padding:1.2vh 1vw;font-size:clamp(15px,2.3vh,30px);line-height:1.25;min-height:12vh}
.guideStep b{color:var(--ice);display:block;font-size:2vh;margin-bottom:.6vh}
.guideFacts{display:flex;gap:1vw;width:92vw}
.guideFact{flex:1;min-width:0;border:.4vh solid var(--g);padding:.7vh 1vw;font-size:clamp(15px,2.4vh,31px);line-height:1.2}
.guideFact:nth-child(2){border-color:var(--teal)}
.guideFact b{color:var(--g);display:block;font-size:1.8vh;letter-spacing:.12em;margin-bottom:.3vh}
.gameScene{height:15vh;min-height:105px;display:flex;align-items:center;justify-content:center}
.gameScene svg{width:min(46vw,460px);height:100%;overflow:visible;shape-rendering:crispEdges}
.scene-1 .snowball{animation:snowdrop 3.5s steps(5) infinite}
.scene-1 .snowball:nth-of-type(2){animation-delay:.25s}.scene-1 .snowball:nth-of-type(3){animation-delay:.5s}
.scene-1 .snowball:nth-of-type(4){animation-delay:.75s}.scene-1 .snowball:nth-of-type(5){animation-delay:1s}
@keyframes snowdrop{0%,20%{transform:none;opacity:1}60%,80%{transform:translate(16px,30px);opacity:0}100%{transform:none;opacity:1}}
.scene-2 .plate{transform-origin:65px 58px;animation:fanplate 1.2s steps(3) infinite alternate}
.scene-2 .wind{animation:wind 1.2s steps(4) infinite}
.scene-2 .flame{animation:flicker 2.4s steps(2) infinite}
@keyframes fanplate{to{transform:rotate(26deg)}}@keyframes wind{0%{transform:translateX(0);opacity:0}30%{opacity:1}100%{transform:translateX(75px);opacity:0}}@keyframes flicker{50%{transform:scale(.65);opacity:.5}}
.scene-3 .cane{animation:dropcane 2.8s steps(5) infinite}
@keyframes dropcane{0%,15%{transform:none}60%,78%{transform:translateY(45px)}100%{transform:none}}
.scene-4 .flame{animation:flameout 4s steps(1) infinite}
.scene-4 .flame:nth-of-type(2){animation-delay:.15s}.scene-4 .flame:nth-of-type(3){animation-delay:.3s}.scene-4 .flame:nth-of-type(4){animation-delay:.45s}
.scene-4 .flame:nth-of-type(5){animation-delay:.6s}.scene-4 .flame:nth-of-type(6){animation-delay:.75s}.scene-4 .flame:nth-of-type(7){animation-delay:.9s}.scene-4 .flame:nth-of-type(8){animation-delay:1.05s}
@keyframes flameout{0%,38%{opacity:1;transform:none}40%,80%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:none}}
.scene-5 .tree{animation:reach 3.4s steps(6) infinite}
@keyframes reach{0%,15%{transform:none}65%,82%{transform:translateX(116px)}100%{transform:none}}
.scene-6 .ribbon{stroke-dasharray:190;animation:unspool 3s steps(8) infinite}
.scene-6 .roll{transform-origin:65px 57px;animation:roll 3s steps(8) infinite}
@keyframes unspool{0%,15%{stroke-dashoffset:190}75%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:190}}@keyframes roll{to{transform:rotate(360deg)}}
.scene-7 .coil{animation:relay 3.2s steps(7) infinite}
@keyframes relay{0%,18%{transform:none}70%,85%{transform:translateX(164px)}100%{transform:none}}
.scene-8 .ornament{animation:ornamentdrop 3s steps(6) infinite}
@keyframes ornamentdrop{0%,15%{transform:none;opacity:1}60%{transform:translate(154px,27px)}72%,85%{transform:translate(154px,48px);opacity:1}100%{transform:none;opacity:1}}

@keyframes stack1{0%,12%{transform:none}35%,85%{transform:translate(80px,0)}100%{transform:none}}
@keyframes stack2{0%,30%{transform:none}55%,85%{transform:translate(-92px,-15px)}100%{transform:none}}
@keyframes stack3{0%,48%{transform:none}72%,85%{transform:translate(95px,28px)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.gameScene *,.hop .in,.bob,.wob,.cf{animation:none!important}}
#msg.rules .gr{width:92vw;gap:.8vw}
#msg.rules .gb{flex:1 1 16%;min-width:15%;font-size:clamp(14px,2.1vh,27px);padding:.7vh .7vw;overflow-wrap:anywhere}
#msg.rules .tag{font-size:2.2vh;padding:.5vh 1.5vw}
@media(max-height:700px){#msg.rules{gap:.8vh}.guideStep{min-height:0;font-size:2.1vh}.guideGoal{font-size:2.7vh}}
#bd{height:100%;flex-direction:column}
#T h1{font-size:7vh;color:var(--l);text-shadow:.6vh .6vh 0 #000}
.tag{border:.5vh solid var(--g);padding:.8vh 2vw;font-size:2.6vh;color:var(--g)}
.rl{font-size:3.2vh;max-width:70vw;font-weight:400;color:#cfc6a8}
.gr{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.gb{border:.5vh solid var(--d);padding:1.4vh 2vw;font-size:2.8vh;background:#111}
#T .sm{font-size:2.6vh}
#ban{height:6vh;font-size:3.4vh;color:var(--l);margin-top:1vh}
#rows{position:relative;flex:1;margin-top:1vh}
.row{position:absolute;left:0;right:0;top:0;height:10%;transition:transform .9s steps(10)}
.in{height:100%;padding:.5vh 0;display:flex;align-items:center;gap:2vw}
.rk{width:6vh;font-size:4vh;color:var(--g)}
.bar{flex:1;height:100%;border:.5vh solid var(--d);background:#111;position:relative;display:flex;align-items:center}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);transition:width .9s steps(12)}
.nm{position:relative;z-index:1;padding-left:2vw;font-size:3.6vh;text-shadow:.4vh .4vh 0 #000;display:flex;gap:1.2vw;align-items:center}
.pt{width:11vh;font-size:4.4vh;color:var(--l);text-align:right}
.z0{--c:#d4af37}.z1{--c:#355b6c}.z2{--c:#865047}.z3{--c:#a8262c}
.hid .bar i{width:0!important}.hid .nm{color:#555}
.hop .in{animation:hop .5s steps(4)}
#lg{font-size:2vh;color:var(--muted);margin-top:1vh}
.bob{animation:bob 1s steps(2) infinite}.wob{animation:wob .6s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-1.4vh)}}@keyframes bob{50%{transform:translateY(-1.2vh)}}@keyframes wob{50%{transform:rotate(-8deg)}}
.cf{position:fixed;top:-3vh;width:1.4vh;height:1.4vh;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh)}}

const sum=S.sc.reduce((a,r)=>a+(r[g]||0),0);
c+=`<div class="rw" style="margin-top:10px"><button onclick="clr(${g})">Clear game</button></div><div class="sm" style="margin-top:8px">POINTS GIVEN ${sum} / ${EXP[x.t]} ${sum==EXP[x.t]?'✓':''}</div></div>`;
h+=c;
const st=stand(9),ties=allDone()?st.filter((o,k)=>(k>0&&st[k-1].t==o.t&&st[k-1].b==o.b)).map(o=>o.r-1):[];
h+=`<div class="lb">STANDINGS</div><div style="line-height:1.8">${st.map(o=>`${o.r}. ${nm(o.i)} <b style="color:var(--l)">${o.t}</b>`).join(' · ')}</div>`;
if(ties.length)h+=`<div class="msg">TIE FOR PLACE ${ties.join(', ')}: replay Snow Blower, then give the winner a +1 tie-break below.</div>`;
h+=`<div class="rw" style="margin-top:10px"><button onclick="copyRes()">Copy results</button></div>
<details><summary>NAMES &amp; TIE-BREAK</summary>${S.nm.map((n,i)=>`<div class="nr"><input value="${esc(n)}" maxlength="14" onchange="nn(${i},this.value)"><button onclick="tbb(${i},-1)">−</button><span>${S.tb[i]||0}</span><button onclick="tbb(${i},1)">+</button></div>`).join('')}<div class="rw" style="margin-top:12px"><button onclick="reset()">Reset all scores</button></div></details>`;
$('H').innerHTML=h}
// ---- tv ----
const rows=[];
function mkRows(){for(let i=0;i<10;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<div class="in"><b class="rk"></b><div class="bar"><i></i><span class="nm"></span></div><b class="pt"></b></div>';$('rows').appendChild(d);rows.push(d)}}
function confetti(){for(let k=0;k<80;k++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:${['#f3d77a','#d4af37','#fff','#65d9cb','#ff8b78'][k%5]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.5}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),7000)}}
let lastRev=-1;
function tv(){const m=S.m,rank=m[0]=='rev'&&m[1]>0?REVEAL_ORDER[m[1]-1]:null,spot=m[0]=='rev'&&S.spotlight&&(rank===1||rank===10),sealed=m[0]=='board'&&m[1]>=9&&allDone()&&!S.finalShown,b=!sealed&&!spot&&(m[0]=='board'||m[0]=='rev');$('bd').style.display=b?'flex':'none';$('msg').style.display=b?'none':'flex';
$('msg').className=spot?'spotlight '+(rank===10?'trophy':'champion'):m[0]=='rules'?'rules':'';
if(!b){lastRev=-1;if(spot){const st=stand(9),who=st[rank-1];$('msg').innerHTML=`<div class="spot-icon">${spr(rank===10?'trophy':'medal',14)}</div><div class="spot-rank">${rank===10?'10TH PLACE · THE JIALAT TROPHY':'1ST PLACE · CHAMPION'}</div><h1>${rank===10?'THE JIALAT TROPHY':'THE CHAMPION'}</h1><div class="spot-name">${nm(who.i)}</div>`}
else if(sealed){$('msg').innerHTML=`<div class="bob">${spr('screen',8)}</div><h1>ALL NINE GAMES COMPLETE</h1><div class="tag">THE FINAL REVEAL IS COMING</div>`}
else if(m[0]=='rules'){const x=G[m[1]],a=GUIDE[m[1]],kind={s:'SOLO',p:'PAIRS',t:'TEAMS OF FIVE'}[x.t];
$('msg').innerHTML=`<div class="sm">GAME ${String(m[1]+1).padStart(2,'0')} / 09</div><h1>${esc(x.n)}</h1><div class="tag">${kind}</div><div class="guideGoal">${esc(a.goal)}</div>${scene(m[1])}
<div class="guideSteps">${a.steps.map((s,i)=>`<div class="guideStep"><b>STEP ${i+1}</b>${esc(s)}</div>`).join('')}</div>
<div class="guideFacts"><div class="guideFact"><b>PLAY</b>${esc(a.turn)}</div><div class="guideFact"><b>WIN BY</b>${esc(a.win)}</div><div class="guideFact"><b>POINTS</b>${esc(a.points)}</div></div>
${x.u?`<div class="sm">${x.t=='p'?'PAIR LINEUP':'TEAMS'}</div><div class="gr">${x.u.map((u,k)=>`<div class="gb">${x.t=='t'?'TEAM '+'AB'[k]+'<br>':''}${u.map(p=>nm(p-1)).join(x.t=='t'?' · ':' &amp; ')}</div>`).join('')}</div>`:''}`}
else $('msg').innerHTML=`<div class="bob">${spr('screen',8)}</div><h1>JIALAT CHRISTMAS 2026</h1><div class="tag">18 YEARS · 10 FRIENDS · 9 GAMES</div>`;return}
const rev=m[0]=='rev',k=rev?m[1]:10,n=rev?9:m[1],fin=rev||(n>=9&&allDone()&&S.finalShown),st=stand(n),top=Math.max(1,st[0].t);
$('th').textContent=rev?'THE FINAL VERDICT':n>=9?(fin?'FINAL STANDINGS':'LIVE STANDINGS'):'AFTER GAME '+n;
$('ban').textContent=!rev||!k?'':rank===10?'THE JIALAT TROPHY GOES TO '+rn(st[9].i).toUpperCase():rank===1?'CHAMPION: '+rn(st[0].i).toUpperCase():rank>=7?'NEXT YEAR’S ORGANISER: '+rn(st[rank-1].i).toUpperCase():'#'+rank+' SAFE: '+rn(st[rank-1].i).toUpperCase();
st.forEach(o=>{const d=rows[o.i],hide=rev&&!REVEAL_ORDER.slice(0,k).includes(o.r),z=o.r==10?3:o.r>=7?2:o.r==1?0:1,old=d.dataset.r;
d.style.transform=`translateY(${(o.r-1)*100}%)`;d.className='row z'+z+(hide?' hid':'');
if(old&&old!=o.r&&!hide){d.classList.add('hop')}d.dataset.r=o.r;
d.querySelector('.rk').textContent=o.r;d.querySelector('.nm').innerHTML=hide?'???':esc(rn(o.i))+(fin&&o.r==10?`<span class="wob">${spr('medal',3)}</span>`:fin&&o.r>=7&&o.r<10?'<small>ORGANISER</small>':'');
d.querySelector('i').style.width=hide?'0':(o.t/top*100)+'%';d.querySelector('.pt').textContent=hide?'':o.t});
if(rev&&k==10&&lastRev!=10)confetti();lastRev=rev?k:-1}
// ---- boot ----
function render(){document.body.className=ROLE||'landing';if(ROLE=='host')host();else if(ROLE=='tv')tv();else $('H').innerHTML=`<div class="chooser"><svg class="pixel-abacus" viewBox="0 0 18 14" aria-label="Animated pixel abacus" role="img">
<path fill="#d4af37" d="M1 1h16v1H1zM1 2h1v10H1zM16 2h1v10h-1zM1 12h16v1H1z"/>
<path fill="#6b5a22" d="M3 4h12v1H3zM3 7h12v1H3zM3 10h12v1H3z"/>
<g class="bead-one"><path fill="#65d9cb" d="M4 3h2v3H4z"/></g>
<g class="bead-two"><path fill="#86baff" d="M5 6h2v3H5z"/></g>
<g class="bead-three"><path fill="#ff8b78" d="M7 9h2v3H7z"/></g>
</svg><h1>SCOREBOARD</h1><div class="rw"><button class="go" onclick="location.hash='host';location.reload()">iPad · Host</button><button class="go" onclick="location.hash='tv';location.reload()">MacBook · TV</button></div></div>`}
if(ROLE=='tv'){mkRows();$('T').ondblclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
render();if(ROLE)conn();
if(ROLE==='host')try{queued=localStorage.getItem(pendingKey);if(queued){status('','Sending saved update…');sendLatest()}}catch(e){}
</script></body></html>
